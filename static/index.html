<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropQR</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>DROPQR</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="send">SEND</button>
            <button class="tab-btn" data-tab="receive">RECEIVE</button>
        </div>

        <div class="display-area">

            <!-- SEND INITIAL STATE -->
            <div class="state-panel active" id="state-send-init">
                <div class="drop-zone" id="drop-zone">
                    CLICK OR DROP FILE
                </div>
                <input type="file" id="file-input" hidden>

                <div id="file-info" class="hidden" style="width: 100%; text-align: center; margin-bottom: 1rem;">
                    <div class="text-sm" id="file-name" style="color: var(--fg); font-weight: bold;"></div>
                    <div class="text-sm" id="file-size"></div>
                </div>

                <div class="settings hidden" id="send-settings">
                    <div class="text-sm">SPEED: <span id="fps-display">15</span> FPS</div>
                    <input type="range" id="fps-slider" min="1" max="30" value="15">
                    <div class="text-sm" id="est-time" style="margin-top:0.5rem; color:#666;"></div>
                </div>

                <button class="btn hidden" id="start-flash-btn">START TRANSFER</button>
                <button class="btn hidden" id="remove-file-btn" style="border-color: #333;">CANCEL</button>
            </div>

            <!-- SEND FLASHING STATE -->
            <div class="state-panel" id="state-send-flash">
                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" id="flash-progress"></div>
                </div>
                <div class="text-sm" id="flash-text">FRAME 1/1</div>
                <button class="btn" id="stop-flash-btn">STOP</button>
            </div>

            <!-- RECEIVE INITIAL STATE -->
            <div class="state-panel" id="state-receive-init">
                <div class="text-sm" style="margin-bottom: 2rem;">POINT CAMERA AT FLASHING QR</div>
                <button class="btn" id="start-scan-btn">START SCANNER</button>
            </div>

            <!-- RECEIVE SCANNING STATE -->
            <div class="state-panel" id="state-receive-scan">
                <div class="scanner-box">
                    <div id="reader"></div>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" id="receive-progress"></div>
                </div>
                <div class="text-sm" id="receive-text">0/0 CHUNKS</div>
                <button class="btn" id="stop-scan-btn">STOP</button>
            </div>

            <!-- RECEIVE COMPLETE STATE -->
            <div class="state-panel" id="state-receive-done">
                <div class="text-sm" style="margin-bottom: 1rem; color: var(--fg);">TRANSFER COMPLETE</div>
                <div class="text-sm" id="received-filename" style="margin-bottom: 2rem;"></div>
                <a class="btn" id="download-btn">SAVE FILE</a>
                <button class="btn" id="reset-receive-btn" style="margin-top:0.5rem; border-color: #333;">SCAN
                    ANOTHER</button>
            </div>

        </div>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
